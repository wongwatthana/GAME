<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เกมพาเพลิน - เพื่อนข้างใจ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Tahoma", "Sarabun", sans-serif;
      background: linear-gradient(180deg, #fff6eb 0%, #f5efff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #4a3b52;
    }
    .container {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 10px 28px rgba(107, 78, 128, 0.12);
      text-align: center;
      border: 3px solid #f2d9b1;
    }
    h1 { font-size: 28px; color: #c9621e; margin-bottom: 8px; }
    p.subtitle { font-size: 17px; color: #6e6275; margin-bottom: 26px; line-height: 1.5; }
    .game-list { display: flex; flex-direction: column; gap: 18px; }
    .game-card {
      display: flex;
      align-items: center;
      text-decoration: none;
      padding: 20px;
      border-radius: 22px;
      transition: transform 0.15s ease;
      text-align: left;
      gap: 16px;
    }
    .game-card:active { transform: scale(0.98); }
    .card-1 { background-color: #fff3eb; border: 2px solid #f7c39c; color: #8c4111; }
    .card-2 { background-color: #f3ebff; border: 2px solid #d1b8ff; color: #4d2885; }
    .icon-box {
      font-size: 42px;
      background: #ffffff;
      width: 70px;
      height: 70px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }
    .game-info h2 { font-size: 21px; margin-bottom: 6px; }
    .game-info p { font-size: 15px; opacity: 0.85; line-height: 1.4; }
    .footer-note { margin-top: 24px; font-size: 14px; color: #8c8294; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 เกมพาเพลิน 🎮</h1>
    <p class="subtitle">เลือกเกมที่ต้องการเล่นได้เลยนะคะ<br>เล่นเพลินๆ ฝึกสายตาและสมองค่ะ</p>

    <div class="game-list">
      <a href="https://wongwatthana.github.io/spot-the-difference/" class="game-card card-1">
        <div class="icon-box">🔍</div>
        <div class="game-info">
          <h2>เกมจับผิดภาพ</h2>
          <p>มองเทียบสองภาพ แล้วแตะตรงจุดที่แตกต่างกัน</p>
        </div>
      </a>

      <a href="https://wongwatthana.github.io/number-matching-game/" class="game-card card-2">
        <div class="icon-box">🔢</div>
        <div class="game-info">
          <h2>เกมลากเลขจับคู่</h2>
          <p>ลากตัวเลขไปวางจับคู่กับรูปภาพให้ถูกต้อง</p>
        </div>
      </a>
    </div>

    <div class="footer-note">ค่อยๆ เล่น ไม่ต้องรีบนะคะ 🥰</div>
  </div>
</body>
</html>
